name: Probabilistic Signals CI

on:
  push:
    branches:
      - agent/probabilistic-operational-signals
  pull_request:
    paths:
      - "project/**"
      - "tests/project/**"
      - "indicators.py"
      - "requirements.txt"
      - ".github/workflows/probabilistic-signals-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q project tests indicators.py

      - name: Run operational and probabilistic tests
        run: >-
          python -m pytest -q
          tests/project/test_probabilistic_strategy_engine.py
          tests/project/test_scheduler_operational_priority.py
          tests/project/test_operational_engines.py
