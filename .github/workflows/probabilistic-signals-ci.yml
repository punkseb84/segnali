name: Probabilistic Signals CI

on:
  push:
    branches:
      - agent/probabilistic-operational-signals
  pull_request:
    paths:
      - "project/**"
      - "tests/project/**"
      - "indicators.py"
      - "requirements.txt"
      - ".github/workflows/probabilistic-signals-ci.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q project tests indicators.py

      - name: Run operational and probabilistic tests
        run: >-
          python -m pytest -q
          tests/project/test_probabilistic_strategy_engine.py
          tests/project/test_scheduler_operational_priority.py
          tests/project/test_operational_engines.py

      - name: Report result on pull request
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          PR_NUMBER=$(gh api "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Probabilistic Signals CI: **${JOB_STATUS}** for commit \`${COMMIT_SHA}\`. Checks: compileall + probabilistic engine tests + scheduler priority tests + operational engine tests."
          fi
