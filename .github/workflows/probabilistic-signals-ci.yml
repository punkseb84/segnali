name: Probabilistic Signals CI

on:
  push:
    branches:
      - agent/probabilistic-operational-signals
  pull_request:
    paths:
      - "project/**"
      - "tests/project/**"
      - "indicators.py"
      - "requirements.txt"
      - ".github/workflows/probabilistic-signals-ci.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Correct weak-edge rejection accounting
        id: semantic_patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("project/strategy_engine/service.py")
          source = path.read_text(encoding="utf-8")
          old = '''        if profit_factor <= 1.0 and expectancy <= 0:\n            self.record_candidate_rejection("no_statistical_edge")\n            self.logger.info(\n'''
          new = '''        if profit_factor <= 1.0 and expectancy <= 0:\n            self.logger.info(\n'''
          count = source.count(old)
          if count == 0:
              print("weak-edge accounting already correct")
              print("changed=false")
              Path("semantic-patch-output.txt").write_text("changed=false\n", encoding="utf-8")
          elif count == 1:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
              print("weak-edge accounting corrected")
              Path("semantic-patch-output.txt").write_text("changed=true\n", encoding="utf-8")
          else:
              raise SystemExit(f"unexpected weak-edge block count: {count}")
          PY
          cat semantic-patch-output.txt >> "$GITHUB_OUTPUT"

      - name: Commit semantic fix
        if: steps.semantic_patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/strategy_engine/service.py
          git commit -m "Fix weak-edge rejection accounting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run compile and targeted tests
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo "## compileall"
            python -m compileall -q project tests indicators.py
            echo "## pytest"
            python -m pytest -q \
              tests/project/test_probabilistic_strategy_engine.py \
              tests/project/test_scheduler_operational_priority.py \
              tests/project/test_operational_engines.py
          } 2>&1 | tee ci-output.log

      - name: Report result on pull request
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
        shell: bash
        run: |
          PR_NUMBER=$(gh api "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            {
              echo "Probabilistic Signals CI: **${CHECK_OUTCOME}** for commit \`${COMMIT_SHA}\`."
              echo
              echo '```text'
              tail -n 120 ci-output.log 2>/dev/null || echo "ci-output.log unavailable"
              echo '```'
            } > ci-comment.md
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file ci-comment.md
          fi

      - name: Fail workflow when checks failed
        if: steps.checks.outcome == 'failure'
        run: exit 1
